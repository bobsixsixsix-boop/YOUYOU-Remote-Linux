[package]
name = "youyou-linux"
version = "0.1.10"
edition = "2021"
license = "GPL-3.0-or-later"
description = "Unofficial Linux client for UU Remote, adapted for the Lenovo Y700"

[workspace]
members = ["account", "player"]
resolver = "2"

[dependencies]
youyou-account = { path = "account" }
youyou-player = { path = "player" }
sdl2 = { version = "0.38", features = ["ttf"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
qrcode = { version = "0.14", default-features = false }

[profile.release]
strip = "debuginfo"
